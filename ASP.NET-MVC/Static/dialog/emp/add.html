
<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>无标题文档</title>
    <link rel="stylesheet" type="text/css" href="../../css/style.css"></link>
    <script type="text/javascript" src="../../js/jquery-1.8.3.js"></script>
    <script type="text/javascript" src="../../layer/layer.js"></script>
    <script type="text/javascript" src="../../js/emp/empadd.js"></script>
    <STYLE type="text/css">
        .forminfo1 li {
            margin-bottom: 15px;
            clear: both;
        }
    </STYLE>
</head>
<body>
    <div class="formbody">
        <ul class="forminfo1">
            <!--<li>
                //..
                <select class="selectinput" v-model="PID" style="line-height: 20px;">
                    <option v-for="item in groceryList" v-bind:value="item.PID">
                        {{ item.pname }}
                    </option>
                </select>
                <span>Selected: {{ PID }}</span>
            </li>-->
            <li>
                <label>真实姓名：</label>
                <input v-model="erealname" name="emp.erealname" type="text" id="erealname" class="dfinput1" placeholder="请输入员工真实名称" />
            </li>
            <li>
                <label>所在部门：</label>
                <select v-model="PID" name="pid" id="pid" class="selectinput" style="line-height: 20px;">
                    <option v-for="item in dList" v-bind:value="item.PID" v-text="item.pname"></option>
                </select>
            </li>
            <li>
                <label>用户角色：</label>
                <select v-model="JID" name="jid" id="jid" class="selectinput" style="line-height: 20px;">
                    <option v-for="item in jList" v-bind:value="item.JID" v-text="item.JNAME"></option>
                </select>
            </li>
            <li>
                <label>账号：</label>
                <input v-model="ename" name="emp.ename" type="text" id="ename" class="dfinput1" placeholder="请输入员工账号" />
            </li>
            <li>
                <label>密码：</label>
                <input v-model="epsw" name="emp.epsw" type="text" id="epsw" class="dfinput1" placeholder="请输入员工密码" />
            </li>
            <li>
                <label>电话：</label>
                <input v-model="etel" name="emp.etel" type="text" id="etel" class="dfinput1" placeholder="请输入员工电话" />
            </li>
            <li>
                <label>地址：</label>
                <input v-model="eaddress" name="emp.eaddress" type="text" id="eaddress" class="dfinput1" placeholder="请输入员工地址" />
            </li>
            <li>
                <label>备注：</label>
                <textarea v-model="eremark" name="emp.eremark" cols="" rows="" class="textinput2" id="eremark" placeholder="请输入员工备注"></textarea>
            </li>
            <li id="ADDEMP">
                <label>&nbsp;</label>
                <input type="button" v-on:click="addEmp" class="btn" value="新增员工" />
            </li>
        </ul>
    </div>
    <input type="hidden" id="botao">
</body>
</html>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="../../../vue.js"></script>
<script src="/Static/js/emp/VueAdd.js">
</script>
